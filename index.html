<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>全知讀者視角 × 學測單字｜第1劇本</title>
<style>
:root{
  --bg:#fbf7f4; --paper:#ffffff; --ink:#2b2730; --muted:#8a8290;
  --pill:#f6b3d0; --pill-ink:#3a1f2c; --pill-hide:#f9d6e6;
  --sys:#0f1d3a; --sys-line:#5aa9ff; --sys-ink:#d8ecff;
  --ok:#2fb67c; --bad:#e86a6a; --gold:#f5b942;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:19px;line-height:2.15}
header{background:linear-gradient(135deg,#0f1d3a,#1f3a6e);color:#fff;padding:22px 18px 18px;text-align:center}
header .sys{display:inline-block;border:1.5px solid var(--sys-line);border-radius:6px;padding:2px 12px;font-size:13px;color:var(--sys-ink);letter-spacing:2px;margin-bottom:8px}
header h1{margin:4px 0 2px;font-size:23px;line-height:1.4}
header p{margin:0;font-size:14px;opacity:.8;line-height:1.6}
nav{position:sticky;top:0;z-index:20;display:flex;background:#fff;border-bottom:1px solid #eee;box-shadow:0 2px 8px rgba(0,0,0,.04)}
nav button{flex:1;border:0;background:none;padding:13px 4px;font-size:16px;color:var(--muted);font-family:inherit;cursor:pointer;border-bottom:3px solid transparent}
nav button.on{color:var(--ink);font-weight:700;border-color:#e46aa3}
.chap{display:flex;gap:8px;overflow-x:auto;padding:10px 14px 0}
.chap button{flex:none;border:1.5px solid #e2d6dd;background:#fff;border-radius:20px;padding:4px 14px;font-size:14px;font-family:inherit;color:var(--muted)}
.chap button.on{background:#e46aa3;border-color:#e46aa3;color:#fff}
main{max-width:760px;margin:0 auto;padding:12px 14px 90px}
.panel{display:none}.panel.on{display:block}
.modebar{display:flex;gap:8px;margin:8px 0 12px;flex-wrap:wrap}
.modebar button{border:1.5px solid #e2d6dd;background:#fff;border-radius:10px;padding:6px 12px;font-size:15px;font-family:inherit;cursor:pointer}
.modebar button.on{background:#2b2730;color:#fff;border-color:#2b2730}
.tip{font-size:14px;color:var(--muted);line-height:1.6;margin-bottom:10px}
.story{background:var(--paper);border-radius:16px;padding:18px 18px 8px;box-shadow:0 2px 14px rgba(80,40,60,.06)}
.story h2{font-size:20px;margin:0 0 6px;line-height:1.5}
.story p{margin:0 0 16px;text-align:justify}
.w{display:inline-block;background:var(--pill);color:var(--pill-ink);border-radius:999px;padding:0 10px;margin:2px 2px;line-height:1.75;font-family:Georgia,"Times New Roman",serif;font-size:18px;cursor:pointer;transition:transform .12s,background .2s;white-space:nowrap}
.w .zh{font-family:"PingFang TC","Noto Sans TC",sans-serif;font-size:14px;margin-left:2px}
.w:active{transform:scale(.94)}
.w.seen{box-shadow:inset 0 0 0 2px #e46aa3}
body.hidezh .w .zh{display:none}
body.hidezh .w.peek .zh{display:inline}
body.hideen .w .en{display:none}
body.hideen .w.peek .en{display:inline}
.sysbox{background:var(--sys);color:var(--sys-ink);border:1.5px solid var(--sys-line);border-radius:10px;padding:8px 14px;margin:0 0 16px;font-size:16px;line-height:1.9;box-shadow:0 0 14px rgba(90,169,255,.35)}
.sysbox .w{background:#2e5aa8;color:#fff}
.w.rev{background:#cfe3ff;color:#173a6b}.sysbox .w.rev{background:#8fb8f0;color:#0f1d3a}
.end{text-align:center;color:var(--muted);font-size:15px}
/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(20,10,20,.35);display:none;z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;padding:18px 20px 26px;z-index:41;transform:translateY(110%);transition:transform .25s;max-width:760px;margin:0 auto;line-height:1.6}
.sheet.on{transform:none}.sheet-bg.on{display:block}
.sheet .hw{font-family:Georgia,serif;font-size:32px;font-weight:700}
.sheet .syl{color:#c4447f;font-size:18px;font-family:Georgia,serif;margin-left:6px}
.sheet .pos{display:inline-block;background:#f2eef5;border-radius:6px;padding:0 8px;font-size:14px;margin-right:6px}
.sheet .mean{font-size:20px;margin:6px 0 10px}
.sheet .chunk{background:#fff4f9;border-left:4px solid #e46aa3;padding:8px 12px;border-radius:8px;margin-bottom:8px}
.sheet .chunk b{font-family:Georgia,serif;font-size:18px}
.sheet .scene{font-size:15px;color:#6b6070}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btns button,.btns a{flex:1;border:0;border-radius:12px;padding:11px;font-size:16px;font-family:inherit;background:#2b2730;color:#fff;text-align:center;text-decoration:none;cursor:pointer;min-width:90px}
.btns .alt{background:#f2eef5;color:#2b2730}
/* cards */
.card{background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:0 2px 10px rgba(80,40,60,.05);display:flex;gap:10px;align-items:flex-start;line-height:1.55}
.card .n{color:#c4447f;font-weight:700;font-size:14px;min-width:24px;padding-top:4px}
.card .body{flex:1}
.card .hw{font-family:Georgia,serif;font-size:22px;font-weight:700}
.card .syl{color:#c4447f;font-family:Georgia,serif;font-size:15px;margin-left:4px}
.card .m{font-size:16px;margin:2px 0}
.card .c{font-size:15px;color:#5a4f60}
.card .c b{font-family:Georgia,serif}
.card .spk{border:0;background:#fde3ef;border-radius:50%;width:40px;height:40px;font-size:18px;cursor:pointer;flex:none}
body.cardhide .card .m{filter:blur(6px)}
body.cardhide .card.peek .m{filter:none}
/* quiz */
.qtop{display:flex;align-items:center;gap:10px;margin:6px 0 12px;font-size:15px}
.bar{flex:1;height:14px;background:#eee;border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f39bc4,#e46aa3);transition:width .4s}
.streak{color:var(--gold);font-weight:700;min-width:58px;text-align:right}
.qbox{background:#fff;border-radius:16px;padding:18px;box-shadow:0 2px 14px rgba(80,40,60,.06);line-height:1.8}
.qtype{display:inline-block;background:var(--sys);color:var(--sys-ink);border:1px solid var(--sys-line);border-radius:6px;font-size:13px;padding:0 10px;margin-bottom:10px}
.qtext{font-size:19px;margin-bottom:14px}
.blank{display:inline-block;min-width:80px;border-bottom:3px solid #e46aa3;text-align:center;font-family:Georgia,serif;color:#c4447f}
.opts{display:grid;gap:10px}
.opt{border:2px solid #eadde4;background:#fff;border-radius:14px;padding:12px 14px;font-size:18px;text-align:left;font-family:inherit;cursor:pointer}
.opt.en{font-family:Georgia,serif;font-size:20px}
.opt.right{border-color:var(--ok);background:#e9f9f1}
.opt.wrong{border-color:var(--bad);background:#fdeeee}
.fb{margin-top:12px;font-size:16px;line-height:1.6;min-height:24px}
.big{display:block;width:100%;border:0;border-radius:14px;padding:13px;font-size:18px;font-family:inherit;background:#e46aa3;color:#fff;margin-top:14px;cursor:pointer}
.playbig{font-size:38px;border:0;background:#fde3ef;border-radius:50%;width:84px;height:84px;cursor:pointer;display:block;margin:6px auto 14px}
.clear{text-align:center;padding:30px 10px}
.clear .t{font-size:30px;font-weight:800;color:#c4447f}
.toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.6);opacity:0;font-size:30px;font-weight:900;color:#fff;background:rgba(228,106,163,.95);padding:10px 26px;border-radius:18px;pointer-events:none;z-index:60;transition:all .25s}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.ety{margin-top:10px;font-size:15px;line-height:1.65}
.ety .lab{font-weight:700;color:#5a3a50;margin-top:10px;font-size:14px}
.ety ul{margin:2px 0;padding-left:20px}
.parts{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:4px}
.mp{display:inline-flex;flex-direction:column;align-items:center;border-radius:10px;padding:4px 10px;line-height:1.3}
.mp b{font-family:Georgia,serif;font-size:19px}.mp i{font-style:normal;font-size:12px}
.mp.p{background:#fde3ef;color:#a3245f}.mp.r{background:#dcecff;color:#1d4f91}.mp.s{background:#dff5e8;color:#1f7a4b}
.plus{color:#aaa}
.orig{background:#fff8e6;border-radius:8px;padding:6px 10px}
.na{color:#999;font-weight:400}
.exl li{margin-bottom:6px}.exl i{color:#6b6070;font-family:Georgia,serif}
.role{font-size:12px;border-radius:6px;padding:0 6px;background:#eee;color:#555}.role.ok{background:#ffe9a8;color:#7a5200;font-weight:700}
.lv{background:#2b2730!important;color:#fff}.lvb{background:#2b2730;color:#fff;border-radius:5px;padding:0 5px;font-size:12px;margin-right:4px}
.legend{font-size:13px;color:#8a8290;margin-bottom:8px}
.legend span{border-radius:6px;padding:0 6px;margin-right:4px}
.card .more{display:none}.card.open .more{display:block}
.card .tog{font-size:13px;color:#c4447f;margin-top:4px}
.sheet{max-height:85vh;overflow-y:auto}
header{position:relative;padding:0!important;height:210px;overflow:hidden;background:#1a1840}
#heroArt{position:absolute;inset:0}
.hero-txt{position:absolute;left:0;right:0;bottom:10px;text-align:center;color:#fff;text-shadow:0 2px 8px rgba(10,8,40,.8)}
.hero-txt h1{margin:0;font-size:22px}.hero-txt p{margin:2px 0 0;font-size:13px;opacity:.9}
.chap button{display:flex;align-items:center;gap:6px;padding:4px 12px 4px 4px!important}
.chap button svg{width:42px;height:28px;border-radius:6px;display:block}
.story .thumb{float:right;width:120px;margin:0 0 6px 10px}.story .thumb svg{width:100%;display:block;border-radius:12px}
:root{--pill:#d9d5f3;--pill-ink:#2b2560}
nav button.on{border-color:#7d78c8!important}
.chap button.on{background:#7d78c8!important;border-color:#7d78c8!important}

return `<div class="ety"><div class="lab">🧬 拆解</div><div class="parts">${parts}</div>
<div class="lab">📜 字源</div><div>${e[1]}</div>
<div class="lab">💡 本意（照字根直譯）</div><div class="orig"><b>${LIT[k]?LIT[k][0]:e[2].split(" → ")[0]}</b>${LIT[k]&&LIT[k][1]?`<span class="na">（${LIT[k][1]}）</span>`:""}</div><div class="lab">🔀 怎麼變成現在的意思</div><div>${e[2]}</div>
<div class="lab">📝 常見意思</div><ul>${e[3].map(s=>`<li>${s}</li>`).join("")}</ul>
${e[4]?`<div class="lab">🌱 同根字</div><div>${e[4]}</div>`:""}
<div class="lab">🎯 學測出題 <span class="na">（已比對 106–115 學測）</span></div>${ex?`<ul class="exl">${ex.map(x=>`<li><b>${x[0]}</b> <span class="role ${x[1].includes("正解")?"ok":""}">${x[1]}</span><br>考的意思：${x[2]}${x[3]?`<br><i>…${x[3]}…</i>`:""}</li>`).join("")}</ul>`:`<div class="na">這幾年的學測都沒出現過</div>`}</div>`;}

/* ===== 原創插圖（SVG）：主視覺＋各章小圖 ===== */
const HERO_SVG=`<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice" style="width:100%;height:100%;display:block">
<defs>
<linearGradient id="hsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1840"/><stop offset=".6" stop-color="#3b3a7a"/><stop offset="1" stop-color="#8f8bd0"/></linearGradient>
<radialGradient id="hglow" cx=".5" cy=".55" r=".5"><stop offset="0" stop-color="#cfd9ff" stop-opacity=".9"/><stop offset="1" stop-color="#cfd9ff" stop-opacity="0"/></radialGradient>
<linearGradient id="hwin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f1d3a" stop-opacity=".92"/><stop offset="1" stop-color="#1b2f5e" stop-opacity=".92"/></linearGradient>
</defs>
<rect width="760" height="300" fill="url(#hsky)"/>
<g fill="#fff">${Array.from({length:60},(_,i)=>{const x=(i*137)%760,y=(i*71)%170,r=(i%5===0)?1.8:1;return `<circle cx="${x}" cy="${y}" r="${r}" opacity="${.4+(i%4)*.15}"/>`}).join("")}</g>
<g stroke="#bcd3ff" stroke-width="1.2" opacity=".75" fill="#eaf1ff">
<polyline points="80,60 130,40 175,70 220,52" fill="none"/><circle cx="80" cy="60" r="3"/><circle cx="130" cy="40" r="3.5"/><circle cx="175" cy="70" r="3"/><circle cx="220" cy="52" r="3"/>
<polyline points="560,45 600,80 650,60 690,90 720,58" fill="none"/><circle cx="560" cy="45" r="3"/><circle cx="600" cy="80" r="3.5"/><circle cx="650" cy="60" r="3"/><circle cx="690" cy="90" r="3"/><circle cx="720" cy="58" r="3"/>
</g>
<path d="M0 300 L250 150 L510 150 L760 300 Z" fill="#2a2860"/>
<path d="M250 150 L510 150 L470 180 L290 180 Z" fill="#121033"/>
<ellipse cx="380" cy="165" rx="140" ry="60" fill="url(#hglow)"/>
<g stroke="#a9a6d6" stroke-width="3" opacity=".8"><line x1="300" y1="300" x2="360" y2="160"/><line x1="460" y1="300" x2="400" y2="160"/></g>
<g stroke="#6e6bb0" stroke-width="2" opacity=".6">${[0,1,2,3,4,5].map(i=>{const y=170+i*i*4.2+i*6;const w=30+i*22;return `<line x1="${380-w}" y1="${y}" x2="${380+w}" y2="${y}"/>`}).join("")}</g>
<g fill="#e6e3ff" opacity=".9"><path d="M120 230 l6 -14 6 14 -14 -9 h16z"/><path d="M640 220 l5 -11 5 11 -11 -7 h12z"/></g>
</svg>`;
const CH_ART={
1:`<svg viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg"><rect width="120" height="80" rx="12" fill="#2a2860"/>
<rect x="10" y="18" width="100" height="44" rx="10" fill="#e9e7f8"/><rect x="10" y="50" width="100" height="6" fill="#a9a6d6"/>
<g fill="#3b3a7a"><rect x="18" y="25" width="20" height="16" rx="3"/><rect x="44" y="25" width="20" height="16" rx="3"/><rect x="70" y="25" width="20" height="16" rx="3"/></g>
<rect x="94" y="25" width="10" height="24" rx="2" fill="#8f8bd0"/>
<g fill="#ffe28a"><circle cx="28" cy="14" r="3"/><circle cx="60" cy="14" r="3" opacity=".35"/><circle cx="92" cy="14" r="3"/></g>
<rect x="28" y="64" width="64" height="12" rx="3" fill="#0f1d3a" stroke="#5aa9ff"/><text x="60" y="73" text-anchor="middle" font-size="8" fill="#d8ecff">劇本 #1</text></svg>`,
2:`<svg viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg"><rect width="120" height="80" rx="12" fill="#1a1840"/>
<path d="M10 80 Q60 -10 110 80 Z" fill="#3b3a7a"/><path d="M28 80 Q60 18 92 80 Z" fill="#121033"/>
<g fill="#8f8bd0">${[[22,46],[34,30],[88,34],[98,52],[46,20],[76,22]].map(([x,y])=>`<g transform="translate(${x},${y})"><ellipse rx="5" ry="3.5"/><circle cx="-1.6" cy="-1" r="1" fill="#ffe28a"/><circle cx="1.6" cy="-1" r="1" fill="#ffe28a"/><path d="M-5 0 l-3 -2 M-5 1 l-3 2 M5 0 l3 -2 M5 1 l3 2" stroke="#8f8bd0" stroke-width="1"/></g>`).join("")}</g>
<rect x="28" y="64" width="64" height="12" rx="3" fill="#0f1d3a" stroke="#5aa9ff"/><text x="60" y="73" text-anchor="middle" font-size="8" fill="#d8ecff">劇本 #2</text></svg>`
};
const CLEAR_SVG=`<svg viewBox="0 0 120 120" width="110" xmlns="http://www.w3.org/2000/svg"><circle cx="60" cy="60" r="54" fill="#e9e7f8"/><circle cx="60" cy="60" r="40" fill="#ffe28a" stroke="#d9a520" stroke-width="4"/><text x="60" y="70" text-anchor="middle" font-size="26" font-weight="900" fill="#7a5200">¤</text><g fill="#8f8bd0"><path d="M18 22 l4 -9 4 9 -9 -6 h10z"/><path d="M96 98 l4 -9 4 9 -9 -6 h10z"/><path d="M100 20 l3 -7 3 7 -7 -4 h8z"/></g></svg>`;

/* ===== 工具 ===== */
const $=s=>document.querySelector(s);
let cur=0;
const synth=window.speechSynthesis;
let voice=null;
function pickVoice(){const vs=synth?synth.getVoices():[];voice=vs.find(v=>/en-US/i.test(v.lang)&&/Samantha|Google US|Aria|Jenny|Ava/i.test(v.name))||vs.find(v=>/en-US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;}
if(synth){pickVoice();synth.onvoiceschanged=pickVoice;}
function say(t,rate=0.95){if(!synth)return;synth.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";if(voice)u.voice=voice;u.rate=rate;synth.speak(u);}
let actx=null;
function tone(seq){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();let t=actx.currentTime;seq.forEach(([f,d,type])=>{const o=actx.createOscillator(),g=actx.createGain();o.type=type||"sine";o.frequency.value=f;g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+d);t+=d*.7;});}catch(e){}}
const sfx={ok:()=>tone([[880,.12],[1320,.22]]),bad:()=>tone([[300,.18,"triangle"]]),win:()=>tone([[660,.12],[880,.12],[1100,.12],[1320,.35]]),tap:()=>tone([[1200,.05]])};
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),700);}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function WD(k){for(const c of CHAPTERS){if(c.words[k])return c.words[k];}return null;}
function revWords(c){const s=new Set();c.paras.forEach(p=>{const t=typeof p==="string"?p:p.t;for(const m of t.matchAll(/\{\{(\w+)\|[^}|]+\|r\}\}/g))s.add(m[1]);});return [...s];}
function renderInline(t){return t.replace(/\{\{(\w+)\|([^}|]+)(\|r)?\}\}/g,(m,w,zh,r)=>`<span class="w${r?" rev":""}" data-w="${w}"><span class="en">${w}</span><span class="zh">（${zh}）</span></span>`);}

/* ===== 章節切換 ===== */
function buildChapBar(){$("#chapBar").innerHTML=CHAPTERS.map((c,i)=>`<button class="${i===cur?"on":""}" data-i="${i}">${CH_ART[c.id]||""}第${c.id}劇本</button>`).join("");}
$("#chapBar").onclick=e=>{const b=e.target.closest("button");if(!b)return;cur=+b.dataset.i;buildAll();};

/* ===== 故事 ===== */
function buildStory(){const c=CHAPTERS[cur];$("#story").innerHTML=`${CH_ART[c.id]?`<div class="thumb">${CH_ART[c.id]}</div>`:""}<h2>${c.title}</h2>`+c.paras.map(p=>typeof p==="string"?`<p>${renderInline(p)}</p>`:`<div class="sysbox">${renderInline(p.t)}</div>`).join("")+`<p class="end">——本章完｜新單字 ${Object.keys(c.words).length} 個${revWords(c).length?`＋複習 ${revWords(c).length} 個（藍色）`:""}——<br>到「⚔️ 通關」挑戰吧！</p>`;}
$("#story").onclick=e=>{const w=e.target.closest(".w");if(!w)return;const k=w.dataset.w;w.classList.add("seen");
  if(document.body.classList.contains("hidezh")||document.body.classList.contains("hideen")){if(!w.classList.contains("peek")){w.classList.add("peek");say(k);sfx.tap();return;}}
  say(k);openSheet(k);};
$("#modebar").onclick=e=>{const b=e.target.closest("button");if(!b)return;document.querySelectorAll("#modebar button").forEach(x=>x.classList.toggle("on",x===b));document.body.classList.remove("hidezh","hideen");if(b.dataset.m!=="both")document.body.classList.add(b.dataset.m);document.querySelectorAll(".w.peek").forEach(x=>x.classList.remove("peek"));};

/* ===== 單字小卡（底部彈出） ===== */
function openSheet(k){const d=WD(k);$("#sheet").innerHTML=`<div><span class="hw">${k}</span><span class="syl">${d[0]}</span></div>
<div class="mean"><span class="pos lv">Level ${LEVEL[k]}</span><span class="pos">${d[1]}</span>${d[2]}</div>
<div class="chunk"><b>${d[3]}</b><br>${d[4]}</div>
<div class="scene">🎬 畫面：${d[5]}</div>${etyHTML(k)}
<div class="btns"><button onclick="say('${k}')">🔊 單字</button><button onclick="say(${JSON.stringify(d[3]).replace(/"/g,"&quot;")},.9)">🔊 詞組</button><a class="alt" href="https://www.ldoceonline.com/dictionary/${k}" target="_blank">Longman</a><button class="alt" onclick="closeSheet()">關閉</button></div>`;
$("#sheet").classList.add("on");$("#sheetBg").classList.add("on");}
function closeSheet(){$("#sheet").classList.remove("on");$("#sheetBg").classList.remove("on");}
$("#sheetBg").onclick=closeSheet;

/* ===== 單字卡列表 ===== */
function buildCards(){const W=CHAPTERS[cur].words;$("#cardList").innerHTML=Object.keys(W).map((k,i)=>{const d=W[k];return `<div class="card" data-w="${k}"><div class="n">${i+1}</div><div class="body"><span class="hw">${k}</span><span class="syl">${d[0]}</span><div class="m"><span class="lvb">L${LEVEL[k]}</span> ${d[1]} ${d[2]}</div><div class="c"><b>${d[3]}</b>　${d[4]}</div><div class="tog">▼ 字根・本意・常考意思</div><div class="more">${etyHTML(k)}</div></div><button class="spk" data-s="${k}">🔊</button></div>`}).join("");}
$("#cardList").onclick=e=>{const s=e.target.closest(".spk");if(s){say(s.dataset.s);return;}const c=e.target.closest(".card");if(c){c.classList.toggle("peek");c.classList.toggle("open");}};
$("#cardToggle").onclick=function(){document.body.classList.toggle("cardhide");this.textContent=document.body.classList.contains("cardhide")?"顯示中文":"遮住中文";};
let playing=false;
$("#playAll").onclick=async function(){if(playing){playing=false;synth.cancel();this.textContent="🔊 依序播放全部";return;}playing=true;this.textContent="⏹ 停止";const W=CHAPTERS[cur].words;for(const k of Object.keys(W)){if(!playing)break;document.querySelectorAll(".card").forEach(c=>c.style.outline=c.dataset.w===k?"2px solid #e46aa3":"");await new Promise(r=>{const u=new SpeechSynthesisUtterance(k);u.lang="en-US";if(voice)u.voice=voice;u.rate=.9;u.onend=()=>setTimeout(r,900);synth.speak(u);});}
playing=false;this.textContent="🔊 依序播放全部";document.querySelectorAll(".card").forEach(c=>c.style.outline="");};

/* ===== 通關測驗：聽音選意 + 劇情填空；錯的字會再出現直到答對 ===== */
let Q=[],qi=0,done=0,total=0,streak=0,best=0,firstTry=0;
function sentenceFor(k){const c=CHAPTERS[cur];for(const p of c.paras){const t=typeof p==="string"?p:p.t.replace(/<br>/g," ");if(t.includes("{{"+k+"|")){
  // 取出包含該字的那一句
  const parts=t.split(/(?<=[。！？」])/);const s=parts.find(x=>x.includes("{{"+k+"|"))||t;
  return s.replace(/\{\{(\w+)\|([^}|]+)(?:\|r)?\}\}/g,(m,w,zh)=>w===k?`<span class="blank">？</span>`:`<span class="w" style="pointer-events:none">${w}<span class="zh">（${zh}）</span></span>`);}}return "";}
function QW(){const o={};CHAPTERS.slice(0,cur+1).forEach(c=>Object.assign(o,c.words));return o;}
function makeQ(k,type){const W=QW(),keys=Object.keys(W),pos=W[k][1];
  let pool=keys.filter(x=>x!==k&&W[x][1].split("/")[0]===pos.split("/")[0]);if(pool.length<3)pool=keys.filter(x=>x!==k);
  const opts=shuffle([k,...shuffle(pool).slice(0,3)]);return {k,type,opts,tries:0};}
function startQuiz(){const c=CHAPTERS[cur],keys=Object.keys(c.words);Q=[];shuffle(keys).forEach((k,i)=>Q.push(makeQ(k,i%2?"listen":"cloze")));revWords(c).forEach(k=>Q.splice(Math.floor(Math.random()*(Q.length+1)),0,makeQ(k,"cloze")));total=Q.length;qi=0;done=0;streak=0;best=0;firstTry=0;showQ();}
function upd(){$("#qcount").textContent=`${done}/${total}`;$("#qbar").style.width=(done/total*100)+"%";$("#qstreak").textContent=streak>=2?`🔥×${streak}`:"";}
function showQ(){upd();if(qi>=Q.length){return finish();}const q=Q[qi],W=QW();let h="";
  if(q.type==="listen"){h=`<div class="qtype">【聽音選意】</div><div class="qtext">聽發音，選出正確的中文意思</div><button class="playbig" id="pb">🔊</button><div class="opts">${q.opts.map(o=>`<button class="opt" data-o="${o}">${W[o][2]}</button>`).join("")}</div>`;}
  else{h=`<div class="qtype">【劇情填空】${CHAPTERS[cur].words[q.k]?"":"・複習"}</div><div class="qtext">${sentenceFor(q.k)}</div><div class="opts">${q.opts.map(o=>`<button class="opt en" data-o="${o}">${o}</button>`).join("")}</div>`;}
  $("#qarea").innerHTML=`<div class="qbox">${h}<div class="fb" id="fb"></div></div>`;
  if(q.type==="listen"){$("#pb").onclick=()=>say(q.k);setTimeout(()=>say(q.k),300);}
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(b));}
function answer(b){const q=Q[qi],W=QW(),d=W[q.k];if(b.disabled)return;
  if(b.dataset.o===q.k){document.querySelectorAll(".opt").forEach(x=>x.disabled=true);b.classList.add("right");sfx.ok();streak++;best=Math.max(best,streak);if(q.tries===0)firstTry++;done++;
    const praise=streak>=5?"🔥 連擊！星座們為你喝采！":streak>=3?"✨ 太強了！":"⭕ 答對了！";toast(streak>=3?`COMBO ${streak}`:"＋1");
    $("#fb").innerHTML=`<b>${praise}</b><br><span style="font-family:Georgia,serif;font-size:19px">${q.k}</span> ${d[2]}<br>搭配：<b>${d[3]}</b>（${d[4]}）<button class="big" id="nx">下一題 ▶</button>`;
    say(q.k);upd();$("#nx").onclick=()=>{qi++;showQ();};}
  else{b.classList.add("wrong");b.disabled=true;sfx.bad();streak=0;
    if(q.tries===0){Q.push(makeQ(q.k,q.type==="listen"?"cloze":"listen"));total++;}
    q.tries++;$("#fb").innerHTML=`沒關係，再選一次 💪（${b.dataset.o} 是「${W[b.dataset.o][2]}」）<br><span style="color:#8a8290;font-size:14px">這個字等等會再出現一次</span>`;upd();}}
function finish(){sfx.win();const n=Object.keys(CHAPTERS[cur].words).length;
  $("#qarea").innerHTML=`<div class="qbox clear"><div class="sysbox" style="text-align:left">【主線劇本 #${CHAPTERS[cur].id} 已通關】<br>【獲得新單字 ${n} 個】<br>【一次答對：${firstTry} 題｜最高連擊：${best}】</div>${CLEAR_SVG}<div class="t">🎉 CLEAR！</div><p>星座「單字之神」對你的表現非常滿意。</p><button class="big" id="again">再挑戰一次</button></div>`;
  $("#again").onclick=startQuiz;upd();}

/* ===== 分頁 ===== */
document.querySelector("nav").onclick=e=>{const b=e.target.closest("button");if(!b)return;document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("on",p.id==="p-"+b.dataset.tab));window.scrollTo(0,0);};
function buildAll(){buildChapBar();buildStory();buildCards();startQuiz();}
$("#heroArt").innerHTML=HERO_SVG;cur=CHAPTERS.length-1;buildAll();
</script>
